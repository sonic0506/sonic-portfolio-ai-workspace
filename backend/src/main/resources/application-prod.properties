# Production on the Lightsail server (ADR-0017). Values that are not secrets live here;
# secrets come from deploy/.env through docker compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/portfolio}
spring.datasource.username=${DB_USERNAME:portfolio}
spring.datasource.password=${DB_PASSWORD}
# Answers and embeddings are paid OpenAI calls; both are on in production.
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.model.embedding.text=openai
spring.ai.model.embedding.multimodal=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# Caddy (same Docker network, a private address Tomcat trusts by default) sets X-Forwarded-For/Proto,
# so the chat limit counts the visitor's IP, not Caddy's. The api port is never published.
server.forward-headers-strategy=native
# Admin login runs through the Vercel rewrite on admin.sonic-portfolio.com (ADR-0017).
# Spring only checks state on the callback, so a fixed redirect-uri works behind the proxy.
spring.security.oauth2.client.registration.github.redirect-uri=https://admin.sonic-portfolio.com/login/oauth2/code/{registrationId}
app.admin.login-success-url=https://admin.sonic-portfolio.com/
# Only the portfolio's browser chat calls the API cross-origin.
app.cors.allowed-origins=https://www.sonic-portfolio.com,https://sonic-portfolio.com
# Image uploads (ADR-0020); keys come from deploy/.env
app.media.bucket=${S3_BUCKET:sonic-portfolio-images}
app.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:https://images.sonic-portfolio.com}
app.media.key-prefix=images
