# Start from backend/ with --spring.profiles.active=local.
spring.config.import=optional:file:.env[.properties]
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/portfolio}
spring.datasource.username=${DB_USERNAME:portfolio}
spring.datasource.password=${DB_PASSWORD}
# OpenAI models are off by default; no API key needed. Embeddings (RAG indexing, paid) turn on with
# EMBEDDING_PROVIDER=openai and OPENAI_API_KEY in backend/.env (ADR-0006); answers (chat, paid) with CHAT_PROVIDER=openai.
spring.ai.model.chat=${CHAT_PROVIDER:none}
spring.ai.model.embedding=${EMBEDDING_PROVIDER:none}
spring.ai.model.embedding.text=${EMBEDDING_PROVIDER:none}
spring.ai.model.embedding.multimodal=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# Development only: expose Swagger UI (/swagger-ui.html) and /v3/api-docs anonymously.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.security.swagger-public=true
# Local http: the session cookie cannot require HTTPS.
server.servlet.session.cookie.secure=false
