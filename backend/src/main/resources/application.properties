spring.application.name=portfolio-api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
spring.mvc.problemdetails.enabled=true
# API docs are closed by default; the local profile opens them for development.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.security.swagger-public=false
# Admin login: GitHub OAuth + server session (ADR-0010)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.github.scope=read:user
app.admin.github-login=${ADMIN_GITHUB_LOGIN:sonic0506}
app.admin.github-id=${ADMIN_GITHUB_ID:159202139}
app.admin.login-success-url=${ADMIN_LOGIN_SUCCESS_URL:/api/admin/me}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
# RAG embeddings (ADR-0006). The model stays off unless a profile enables spring.ai.model.embedding.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.embedding.options.model=text-embedding-3-small
