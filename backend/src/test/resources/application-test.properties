# Tests use their own database so seeded or hand-entered local data never breaks them (and vice versa).
# One-time setup: see backend/README.md "테스트 DB".
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/portfolio_test}
# Tests never call OpenAI; indexing tests provide a fake EmbeddingClient.
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
spring.ai.model.chat=none
# Run the chat pipeline on the request thread so it sees test-transaction data.
app.chat.async=false
app.chat.limit.per-ip-per-day=3
app.chat.limit.global-per-day=100
